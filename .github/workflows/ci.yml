name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Quality gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskforge
          POSTGRES_PASSWORD: taskforge
          POSTGRES_DB: taskforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskforge -d taskforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://taskforge:taskforge@localhost:5432/taskforge_test?schema=public
      TEST_DATABASE_URL: postgresql://taskforge:taskforge@localhost:5432/taskforge_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Database migration
        run: npx prisma migrate deploy

      - name: Tests
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -t taskforge-api:ci .